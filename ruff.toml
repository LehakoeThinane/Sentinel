target-version = "py312"
line-length = 100
extend-exclude = ["planning"]

[lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "N"]

[lint.isort]
known-first-party = ["scoring"]

[lint.per-file-ignores]
# assert is how pytest expresses expectations
"**/test_*.py" = ["S101"]
"**/tests/**" = ["S101"]
# End-to-end tests call the local stack over HTTP and run docker compose.
"tests/e2e/**" = ["S101", "S310", "S603", "S607"]
