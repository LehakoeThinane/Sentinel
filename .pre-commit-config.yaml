# Install once per clone: pre-commit install
# Run on everything:      pre-commit run --all-files
repos:
  - repo: local
    hooks:
      - id: block-planning
        name: Block private planning files
        # Fails closed: if the staged list cannot be read, the commit is blocked.
        entry: bash -c 'staged=$(git diff --cached --name-only) || { echo "block-planning cannot list staged files"; exit 1; }; if printf "%s\n" "$staged" | grep -q "^planning/"; then echo "planning/ must never be committed"; exit 1; fi'
        language: system
        pass_filenames: false
        always_run: true

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=500]

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.0
    hooks:
      - id: gitleaks

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.1
    hooks:
      - id: ruff-check
      - id: ruff-format

  - repo: local
    hooks:
      - id: dotnet-format
        name: dotnet format (C#)
        entry: dotnet format Sentinel.sln --verify-no-changes --include
        language: system
        files: \.cs$
