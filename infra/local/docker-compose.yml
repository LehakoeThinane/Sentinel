# Local Sentinel stack. Start with:
#   docker compose -f infra/local/docker-compose.yml up -d --wait
#
# Credentials default to local-only placeholders so a clean clone starts
# without setup; override them with --env-file .env (see .env.example).
# Ports bind to 127.0.0.1 so nothing is exposed beyond this machine.

name: sentinel

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sentinel_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-dev-only}
      POSTGRES_DB: ${POSTGRES_DB:-sentinel}
      PAYMENTS_SVC_PASSWORD: ${PAYMENTS_SVC_PASSWORD:-local-dev-only}
      LEDGER_SVC_PASSWORD: ${LEDGER_SVC_PASSWORD:-local-dev-only}
      CASES_SVC_PASSWORD: ${CASES_SVC_PASSWORD:-local-dev-only}
      RECON_SVC_PASSWORD: ${RECON_SVC_PASSWORD:-local-dev-only}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/00-roles.sql:/docker-entrypoint-initdb.d/00-roles.sql:ro
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      # TCP, not the socket: during first-time init the temporary server only
      # listens on the socket, so this passes only once init scripts have run.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 3s
      timeout: 3s
      retries: 30
      start_period: 10s

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 3s
      timeout: 3s
      retries: 20

  kafka:
    image: apache/kafka:4.1.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      # PLAINTEXT for containers on the compose network, EXTERNAL for the host.
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:19092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:19092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # Topics are created explicitly by kafka-init; a typo must fail, not create a topic.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_HEAP_OPTS: -Xms512m -Xmx512m
    ports:
      - "127.0.0.1:19092:19092"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 15s

  # Creates the topics (safe to re-run with --if-not-exists), then idles so its
  # health check can report "topics ready": `up --wait` only returns once they
  # exist. A container that simply exited would be counted as ready on start.
  # Six partitions per topic: adding partitions later would remap keys and
  # break per-payment ordering.
  kafka-init:
    image: apache/kafka:4.1.0
    depends_on:
      kafka:
        condition: service_healthy
    init: true
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        for topic in payments.events ledger.events cases.events; do
          /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 \
            --create --if-not-exists --topic "$$topic" \
            --partitions 6 --replication-factor 1
        done
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --list
        touch /tmp/topics-ready
        exec sleep infinity
    healthcheck:
      test: ["CMD", "test", "-f", "/tmp/topics-ready"]
      interval: 2s
      timeout: 2s
      retries: 60
      start_period: 5s

volumes:
  pgdata:
